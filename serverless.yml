org: tommyloo
service: api-web-scraping

provider:
  name: aws
  runtime: python3.12
  memorySize: 1024
  timeout: 30
  iam:
    role: arn:aws:iam::294858368654:role/LabRole

custom:
  pythonRequirements:
    dockerizePip: non-linux # Recomendado para compilar correctamente la librería en el entorno Lambda

functions:
  scrape_table:
    handler: scrap_table_2.lambda_handler  # Asegúrate de que coincida con el nombre de tu archivo .py
    package:
      include:
        - ./**  # Incluir todo el contenido del directorio
    events:
      - http:
          path: /scrape/table
          method: get
          cors: true
          integration: lambda

resources:
  Resources:
    TablaWebScrapping:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: TablaSismosIGP  # Actualizado para coincidir con tu nuevo código Python
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
